<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Mapa mental: publicar una página web</title><desc id="desc">Mapa mental con cuatro ramas: servidor, hosting, dominio y cómo se relacionan.</desc><rect width="1200" height="760" rx="28" fill="#f4f6f8"/><g stroke="#6b7280" stroke-width="8" fill="none" stroke-linecap="round"><path d="M600 380C450 300 350 190 250 170"/><path d="M600 380C750 300 850 190 950 170"/><path d="M600 380C450 470 350 570 250 590"/><path d="M600 380C750 470 850 570 950 590"/></g><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="430" y="310" width="340" height="140" rx="28" fill="#202b3b"/><text x="600" y="365" font-size="32" fill="#fff" font-weight="bold">PUBLICAR UNA</text><text x="600" y="407" font-size="32" fill="#fff" font-weight="bold">PÁGINA WEB</text><rect x="70" y="75" width="360" height="200" rx="24" fill="#d9eafa" stroke="#3478b8" stroke-width="5"/><text x="250" y="125" font-size="34" fill="#173d65" font-weight="bold">SERVIDOR</text><text x="250" y="170" font-size="22" fill="#173d65">Sistema que responde</text><text x="250" y="202" font-size="22" fill="#173d65">a solicitudes y entrega</text><text x="250" y="234" font-size="22" fill="#173d65">archivos y datos</text><rect x="770" y="75" width="360" height="200" rx="24" fill="#dff2e4" stroke="#398b55" stroke-width="5"/><text x="950" y="125" font-size="34" fill="#205b36" font-weight="bold">HOSTING</text><text x="950" y="170" font-size="22" fill="#205b36">Servicio para guardar</text><text x="950" y="202" font-size="22" fill="#205b36">y mantener disponibles</text><text x="950" y="234" font-size="22" fill="#205b36">los archivos del sitio</text><rect x="70" y="485" width="360" height="200" rx="24" fill="#fce8d9" stroke="#d98241" stroke-width="5"/><text x="250" y="535" font-size="34" fill="#85441c" font-weight="bold">DOMINIO</text><text x="250" y="580" font-size="22" fill="#85441c">Nombre fácil de recordar</text><text x="250" y="612" font-size="22" fill="#85441c">que permite llegar</text><text x="250" y="644" font-size="22" fill="#85441c">a la página web</text><rect x="770" y="485" width="360" height="200" rx="24" fill="#eee4f8" stroke="#8056a8" stroke-width="5"/><text x="950" y="535" font-size="34" fill="#4c3268" font-weight="bold">RELACIÓN</text><text x="950" y="580" font-size="22" fill="#4c3268">El dominio se traduce</text><text x="950" y="612" font-size="22" fill="#4c3268">con DNS y llega al servidor;</text><text x="950" y="644" font-size="22" fill="#4c3268">el hosting entrega los datos</text></g></svg>